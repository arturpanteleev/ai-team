name: Сообщить об ошибке
description: Ошибка в работе ai-team
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время сообщить об ошибке в ai-team.
        Перед отправкой поищите дубликат среди [существующих issue](https://github.com/arturpanteleev/ai-team/issues).

        Опишите наблюдение, а не предлагайте здесь исправление. Если исправление
        меняет поведение, оно специфицируется в OpenSpec change внутри
        `openspec/changes/`, а этот issue лишь ссылается на него.
        См. [CONTRIBUTING.md](https://github.com/arturpanteleev/ai-team/blob/master/CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: Версия ai-team
      description: Вывод `ai-team version` (или коммит, из которого собирали).
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и платформа
      description: Например, macOS 14 arm64 или Ubuntu 22.04 amd64.
      placeholder: macOS 14 arm64
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Опишите неожиданное поведение в нескольких предложениях.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что вы ожидали
      description: Опишите ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: Минимальный набор команд и конфигурации, приводящий к ошибке.
      placeholder: |
        1. `ai-team init` в чистом репозитории
        2. `ai-team run --feature x --task "..." --approve-gates`
        3. Возникает ошибка...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Вывод и логи
      description: Относящийся к делу вывод `ai-team`, коды выхода или файлы из `.ai-team/runs/`. Без секретов.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Конфигурация
      description: Относящаяся к делу часть `.ai-team/config.yaml` (уберите учётные данные).
      render: yaml
  - type: input
    id: openspec-change
    attributes:
      label: OpenSpec change
      description: >-
        Путь к change, который специфицирует исправление, когда он появится.
        Оставьте пустым, если его ещё нет — issue получит метку `needs-change`.
        Исправление, не меняющее наблюдаемое поведение, change не требует вовсе.
      placeholder: openspec/changes/<name>/
  - type: checkboxes
    id: security
    attributes:
      label: Чувствительные данные
      description: Отправляя issue, вы подтверждаете, что не приложили учётных данных и секретов, а вопросы безопасности раскрыли приватно (см. SECURITY.md).
      options:
        - label: Подтверждаю, что секретов и учётных данных нет, а проблема безопасности сообщается приватно.
          required: true
