name: Документация
description: Пробел, ошибка или битая ссылка в документации
labels: [documentation, triage]
body:
  - type: markdown
    attributes:
      value: |
        Помогите держать документацию точной. Сначала поищите среди существующих issue.
  - type: dropdown
    id: area
    attributes:
      label: Раздел
      description: К какой части документации это относится?
      options:
        - README.md
        - docs/ARCHITECTURE.md
        - CONTRIBUTING.md
        - docs/demo
        - Справка CLI и сообщения об ошибках
        - Другое
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Что неверно или отсутствует
      description: Понятное описание пробела, ошибки или битой ссылки.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Предлагаемая правка
      description: По желанию — конкретная формулировка или исправление.
