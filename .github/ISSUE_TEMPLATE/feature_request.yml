name: Предложить доработку
description: Новая возможность или улучшение в ai-team
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за предложение по ai-team.
        Перед отправкой поищите дубликат среди [существующих issue](https://github.com/arturpanteleev/ai-team/issues).

        **Пишите коротко.** ai-team разрабатывается spec-first: нормативные
        формулировки, выбранный подход с альтернативами, критерий приёмки и шаги
        реализации живут в OpenSpec change внутри `openspec/changes/`, а не в
        issue. Issue описывает проблему и ссылается на change. При любом
        расхождении верен change.
        См. [CONTRIBUTING.md](https://github.com/arturpanteleev/ai-team/blob/master/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Проблема
      description: Какую задачу вы решаете? Опишите сценарий и в чём боль, в нескольких предложениях.
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Предполагаемое направление (необязательно)
      description: >-
        Один абзац о направлении, которое вы имеете в виду — достаточно, чтобы
        оценить, стоит ли это делать. Не описывайте здесь дизайн: подход,
        рассмотренные альтернативы и компромиссы решаются в OpenSpec change,
        чтобы существовало ровно одно место, которое может оказаться неверным.
  - type: textarea
    id: examples
    attributes:
      label: Пример использования, CLI или конфигурации (необязательно)
      description: Короткий пример того, как возможность будет применяться.
      render: shell
  - type: input
    id: openspec-change
    attributes:
      label: OpenSpec change
      description: >-
        Путь к change, который это специфицирует, когда он появится. Оставьте
        пустым, если его ещё нет — issue получит метку `needs-change`, а путь
        проставляется после шага Propose.
      placeholder: openspec/changes/<name>/
  - type: checkboxes
    id: acceptance
    attributes:
      label: Участие
      options:
        - label: Готов реализовать это самостоятельно (или помочь с проверкой).
