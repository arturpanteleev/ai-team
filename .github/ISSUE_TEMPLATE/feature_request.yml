name: Feature request
description: Propose a new feature or improvement for ai-team
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature for ai-team.
        Search [existing issues](https://github.com/arturpanteleev/ai-team/issues) first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the scenario and pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What change would address the problem? Be concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why were they insufficient?
  - type: textarea
    id: examples
    attributes:
      label: Example usage / CLI / config
      description: Optional example of how the feature would be used.
      render: shell
  - type: checkboxes
    id: acceptance
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this feature (or help test it).
