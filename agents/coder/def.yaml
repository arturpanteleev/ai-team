name: coder
description: Coder — пишет код по техническому дизайну
runtime: agentcli
cli: opencode
prompt_file: prompt.md
mutation: source
allowed_paths: ['**']
require_diff: true
# V0-1: изменения тестового флота source-этапом блокируются deferred
# exact-subject гейтом, консолидированным в delivery-решение.
test_modify_policy: required
inputs:
  design: '{feature}/design.md'
  tasks: '{feature}/tasks.md'
# Явный контракт результата (COD-02): один только diff в workspace не считается
# успехом — агент обязан произвести и атрибутировать оба артефакта. PR-ссылка
# НЕ объявляется здесь: commit/push/PR выполняет только контроллер после
# approval точного SHA-256 плана; ссылка проверяется на этапе implementation.
outputs:
  diff: '{feature}/coder.diff'
  unit-test-report: '{feature}/unit-test-report.md'
