name: design-reviewer
description: Design Reviewer — оценивает техническое решение и фиксирует рекомендацию
runtime: agentcli
cli: opencode
prompt_file: prompt.md
mutation: none
verdict:
  required: true
  marker: Verdict
  values: [APPROVED, CHANGES_REQUESTED, REJECTED]
inputs:
  specs: '{feature}/specs'
  design: '{feature}/design.md'
  tasks: '{feature}/tasks.md'
outputs:
  design-review: '{feature}/design-review.md'
